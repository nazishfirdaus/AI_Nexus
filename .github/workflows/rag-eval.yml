name: RAG Evaluation Gate

on:
  push:
    branches: [main, ashfaque-development]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (simulated LLM)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          SIMULATE_LLM: "true"
        run: pytest -q

  eval:
    name: Offline bge eval (golden set)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download BGE model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: bge-large-en

      - name: Ingest sample PDF and score the golden dataset
        env:
          SIMULATE_LLM: "true"
        run: |
          python -m evaluation.run_eval --pdf "Synthetic_Mortgage_Loan_File_TEST.pdf" \
            --out evaluation/results.json

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-results
          path: evaluation/results.json